name: Solution1

on:
  push:
    branches: [main]
    paths:
      - 'solution1/**'
      - '.github/workflows/solution1.yml'
  pull_request:
    paths:
      - 'solution1/**'
      - '.github/workflows/solution1.yml'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solution1
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-19 clang-19
      - name: Add RISC-V target
        run: rustup target add riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solution1
      - name: Run build
        run: make build
      - name: Run test
        run: make test
